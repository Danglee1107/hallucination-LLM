[project]
name = "hallucinationllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dangle", email = "le5169851@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "dotenv>=0.9.9",
    "huggingface-hub>=0.27.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7.0",
    "sentencepiece>=0.2.2",
    "tdqm>=0.0.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
hallucinationllm = "hallucinationllm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
